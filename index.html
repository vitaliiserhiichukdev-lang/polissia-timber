<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#14120f" />

    <!--
      Only page-independent tags belong here. Title, description, canonical,
      hreflang, Open Graph and JSON-LD are per-page and per-language, so they
      come from src/seo/pageHead.ts: written into the app-head slot below at
      build time, and kept in sync by useSeo during client navigation. The
      title below is the dev-server fallback and is replaced when prerendering.
    -->
    <title>Polissia Timber — Ukrainian Oak &amp; Pine Timber for European Markets</title>
    <meta property="og:image:alt" content="Close-up of a planed oak edged board" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      No LCP preload here: React emits a preload for each page's own hero image,
      and the prerender step lifts those into this head. A hardcoded one would be
      wrong on every page except the home page.
    -->

    <noscript>
      <style>
        /*
          Scroll-reveal blocks are prerendered in their hidden start state,
          because that is the first frame the client will hydrate to. With no JS
          nothing ever reveals them, so show everything instead.

          Three shapes to undo, because Framer Motion serialises each differently:
          faded HTML uses an inline style, gallery tiles a clip-path, and inside
          SVG it writes an `opacity` *attribute* rather than a style.
        */
        [style*='opacity:0'],
        [style*='clip-path'],
        [opacity='0'] {
          opacity: 1 !important;
          clip-path: none !important;
          transform: none !important;
        }

        /*
          The shipping-map routes are drawn by animating `pathLength`, which
          serialises to a zero-length dash — invisible until the animation runs.
          Scoped to `path` so the reference rings keep their intended dashes.
        */
        path[stroke-dasharray] {
          stroke-dasharray: none !important;
          stroke-dashoffset: 0 !important;
        }
      </style>
    </noscript>

    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
